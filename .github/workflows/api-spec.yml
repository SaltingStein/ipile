name: API Spec

# Exports the generated OpenAPI document (Scramble) so client SDKs (Dart, TypeScript, ...) can be generated from it.
# Download it from the run's "Artifacts" section. Missing routes are caught by tests/Feature/Api/ApiDocumentationTest.php.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest

    name: Export openapi.json

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      # Scramble reads the table columns to type model attributes, so the schema must exist.
      - name: Create database
        run: |
          touch database/database.sqlite
          php artisan migrate --force --no-interaction

      - name: Export OpenAPI document
        run: php artisan scramble:export --path=openapi.json

      - name: Upload OpenAPI document
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi
          path: openapi.json
          if-no-files-found: error
